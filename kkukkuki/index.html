<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>꾹꾹이의 대모험 — Kkukkuki's Adventure</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- 모바일/태블릿 터치 컨트롤 -->
    <div id="touch" class="hidden">
      <div class="pad-left">
        <button class="tbtn" data-key="left">◀</button>
        <button class="tbtn" data-key="right">▶</button>
      </div>
      <div class="pad-right">
        <button class="tbtn" data-key="aimUp">▲</button>
        <button class="tbtn big" data-key="shoot">발사</button>
        <button class="tbtn big" data-key="jump">점프</button>
      </div>
    </div>

    <div id="hint">방향키 이동 · Space 점프 · X 발사 · ↑ 위조준 · P 일시정지 · M 음악</div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/world.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
