    ctx.beginPath();
    ctx.arc(x, y, r * 0.6, 0, Math.PI * 2);
    ctx.arc(x + r * 0.62, y - r * 0.22, r * 0.48, 0, Math.PI * 2);
    ctx.arc(x + r * 1.2, y + r * 0.05, r * 0.4, 0, Math.PI * 2);
    ctx.arc(x + r * 0.5, y + r * 0.28, r * 0.44, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ── 카메라 ─────────────────────────────────────── */
  class Camera {
    constructor(world) {
      this.world = world;
      this.x = 0; this.y = 0;
      this.shake = 0;
      this.ox = 0; this.oy = 0;
    }
    follow(target, instant = false) {
      const w = this.world;
      const wantX = target.x + target.w / 2 - KK.W * 0.42 + (target.facing > 0 ? 60 : -60);
      const wantY = target.y + target.h / 2 - KK.H * 0.58;
      const maxX = Math.max(0, w.pxW - KK.W);
      const maxY = Math.max(0, w.pxH - KK.H);
      const tx = U.clamp(wantX, 0, maxX);
      const ty = U.clamp(wantY, 0, maxY);
      if (instant) { this.x = tx; this.y = ty; }
      else {
        this.x = U.lerp(this.x, tx, 0.11);
        this.y = U.lerp(this.y, ty, 0.09);
      }
    }
    addShake(v) { this.shake = Math.min(22, this.shake + v); }
    update() {
      if (this.shake > 0.2) {
        this.ox = U.rand(-this.shake, this.shake);
        this.oy = U.rand(-this.shake, this.shake);
        this.shake *= 0.86;
      } else { this.ox = this.oy = 0; this.shake = 0; }
    }
    get vx() { return this.x + this.ox; }
    get vy() { return this.y + this.oy; }
  }

  KK.World = World;
  KK.Camera = Camera;

})(window);

/* ===== js/entities.js ===== */
/* ============================================================
   꾹꾹이의 대모험 — entities.js
   꾹꾹이 / 적(고양이·강아지·새·고릴라) / 드럼통 / 탄환 / 아이템
   ============================================================ */
(function (global) {
  'use strict';
  const KK = global.KK;
  const U = KK.util;
  const S = KK.sprites;
  const T = KK.TILE;

  /* ── 물리 충돌 헬퍼 ─────────────────────────────── */
  function collideX(e, world) {
    if (e.vx === 0) return;
    const r0 = Math.floor(e.y / T), r1 = Math.floor((e.y + e.h - 1) / T);
    if (e.vx > 0) {
      const c = Math.floor((e.x + e.w - 1) / T);
      for (let r = r0; r <= r1; r++) if (world.isSolid(c, r)) {
        e.x = c * T - e.w - 0.01; e.vx = 0; e.wallHit = 1; return;
      }
    } else {
      const c = Math.floor(e.x / T);
      for (let r = r0; r <= r1; r++) if (world.isSolid(c, r)) {
        e.x = (c + 1) * T + 0.01; e.vx = 0; e.wallHit = -1; return;
      }
    }
  }

  function collideY(e, world) {
    e.onGround = false;
    e.headCells = null;
    const c0 = Math.floor(e.x / T), c1 = Math.floor((e.x + e.w - 1) / T);
    if (e.vy > 0) {
      const r = Math.floor((e.y + e.h - 1) / T);
      for (let c = c0; c <= c1; c++) {
        const solid = world.isSolid(c, r);
        const oneway = world.isOneWay(c, r) && !e.dropThrough && e.prevBottom <= r * T + 6;
        if (solid || oneway) {
          e.y = r * T - e.h - 0.01;
          e.landedVy = e.vy; e.vy = 0; e.onGround = true;
          return;
        }
      }
    } else if (e.vy < 0) {
      const r = Math.floor(e.y / T);
      const cells = [];
      for (let c = c0; c <= c1; c++) if (world.isSolid(c, r)) cells.push({ c, r });
      if (cells.length) {
        e.y = (r + 1) * T + 0.01; e.vy = 0; e.headCells = cells;
      }
    }
  }

  function atFeet(ctx, e, view, w, h, fn) {
    ctx.save();
    ctx.translate(Math.round(e.x + e.w / 2 - view.x), Math.round(e.y + e.h - view.y));
    ctx.scale(e.facing < 0 ? -1 : 1, 1);
    fn(ctx, w, h);
    ctx.restore();
  }

  /* ── 기본 엔티티 ────────────────────────────────── */
  class Entity {
    constructor(x, y, w, h) {
      this.x = x; this.y = y; this.w = w; this.h = h;
      this.vx = 0; this.vy = 0;
      this.facing = 1; this.tick = 0;
      this.dead = false; this.onGround = false;
      this.gravity = 0.62; this.maxFall = 15;
      this.prevBottom = y + h;
      this.type = 'entity';
      this.solidBody = true;
    }
    get cx() { return this.x + this.w / 2; }
    get cy() { return this.y + this.h / 2; }

    physics(world, dt) {
      this.prevBottom = this.y + this.h;
      this.wallHit = 0;
      this.vy = Math.min(this.maxFall, this.vy + this.gravity * dt);
      this.x += this.vx * dt;
      if (this.solidBody) collideX(this, world);
      this.y += this.vy * dt;
      if (this.solidBody) collideY(this, world);
    }
    // 발 앞쪽이 낭떠러지인가
    edgeAhead(world, dir) {
      const fx = dir > 0 ? this.x + this.w + 3 : this.x - 3;
      const c = Math.floor(fx / T), r = Math.floor((this.y + this.h + 4) / T);
      return !(world.isSolid(c, r) || world.isOneWay(c, r));
    }
    update() { this.tick++; }
    draw() {}
  }

  /* ============================================================
     꾹꾹이 (플레이어)
     ============================================================ */
  const P = {
    ACCEL: 0.62, AIR_ACCEL: 0.42, FRICTION: 0.42,
    MAX: 4.6, MAX_FAST: 7.2,
    JUMP: -12.4, GRAV: 0.66, GRAV_HOLD: 0.42, MAX_FALL: 15,
    COYOTE: 8, BUFFER: 9,
    SHOOT_CD: 13, SHOOT_CD_FAST: 8,
    IFRAME: 96
  };

  class Player extends Entity {
    constructor(x, y) {
      super(x + 5, y - 6, 26, 42);
      this.type = 'player';
      this.maxHp = 3; this.hp = 3;
      this.coyote = 0; this.buffer = 0;
      this.shootCd = 0;
      this.iframe = 0;
      this.state = 'idle';
      this.power = { invincible: 0, speedy: 0, flying: 0, powerShot: 0 };
      this.hurtLock = 0;
      this.jumpHeld = false;
      this.extraJump = false;
      this.deadTimer = 0;
      this.combo = 0; this.comboTimer = 0;
    }

    get invincible() { return this.power.invincible > 0; }

    update(g, dt) {
      this.tick++;
      const inp = KK.input;
      const world = g.world;

      if (this.deadTimer > 0) { // 죽는 연출
        this.deadTimer -= dt;
        this.vy = Math.min(this.maxFall, this.vy + 0.7 * dt);
        this.y += this.vy * dt;
        return;
      }

      // 파워업 타이머
      for (const k in this.power) if (this.power[k] > 0) {
        this.power[k] -= dt;
        if (this.power[k] <= 0) { this.power[k] = 0; if (k !== 'invincible') KK.audio.sfx('bump'); }
      }
      if (this.iframe > 0) this.iframe -= dt;
      if (this.hurtLock > 0) this.hurtLock -= dt;
      if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }

      const fast = this.power.speedy > 0;
      const maxSpd = fast ? P.MAX_FAST : P.MAX;
      const accel = this.onGround ? (fast ? P.ACCEL * 1.35 : P.ACCEL) : P.AIR_ACCEL;

      /* 좌우 이동 */
      let dir = 0;
      if (!this.hurtLock) {
        if (inp.held('left')) dir -= 1;
        if (inp.held('right')) dir += 1;
      }
      const ducking = this.onGround && inp.held('down') && dir === 0;

      if (dir !== 0) {
        this.vx = U.approach(this.vx, maxSpd * dir, accel * dt);
        this.facing = dir;
      } else {
        this.vx = U.approach(this.vx, 0, (this.onGround ? P.FRICTION : P.FRICTION * 0.35) * dt);
      }

      /* 점프 */
      if (inp.hit('jump') && !inp.held('down')) this.buffer = P.BUFFER;
      if (this.buffer > 0) this.buffer -= dt;
      if (this.onGround) { this.coyote = P.COYOTE; this.extraJump = this.power.flying > 0; }
      else if (this.coyote > 0) this.coyote -= dt;

      const flying = this.power.flying > 0;
      if (this.buffer > 0 && (this.coyote > 0 || (flying && this.extraJump))) {
        if (this.coyote <= 0) { this.extraJump = false; KK.audio.sfx('djump'); }
        else KK.audio.sfx('jump');
        this.vy = P.JUMP * (ducking ? 0.85 : 1);
        this.onGround = false; this.coyote = 0; this.buffer = 0;
        this.jumpHeld = true;
        g.puff(this.cx, this.y + this.h, 6, '#ffffff');
      }
      if (!inp.held('jump')) this.jumpHeld = false;

      /* 중력 (점프 유지하면 덜 떨어짐 = 가변 점프) */
      this.gravity = (this.jumpHeld && this.vy < 0) ? P.GRAV_HOLD : P.GRAV;
      this.maxFall = P.MAX_FALL;

      /* 날기: 공중에서 점프 유지 → 활공/상승 */
      if (flying && inp.held('jump') && !this.onGround && this.vy > -3.2) {
        this.vy -= 0.85 * dt;
        if (this.tick % 5 === 0) g.puff(this.cx, this.y + this.h, 1, '#dff3ff');
      }

      /* 발사 */
      if (this.shootCd > 0) this.shootCd -= dt;
      if (inp.held('shoot') && this.shootCd <= 0 && !this.hurtLock) {
        this.shoot(g, inp.held('up'));
        this.shootCd = this.power.powerShot > 0 ? P.SHOOT_CD_FAST : P.SHOOT_CD;
      }

      /* 이동 & 충돌 */
      this.dropThrough = inp.held('down') && inp.hit('jump');
      this.physics(world, dt);

      /* 머리로 블록 치기 */
      if (this.headCells) {
        let hitAny = false;
        for (const cell of this.headCells) {
          if (g.hitBlock(cell.c, cell.r, 'head')) hitAny = true;
        }
        if (!hitAny) KK.audio.sfx('bump');
      }

      /* 가시 */
      if (world.hazardHit(this)) this.hurt(g, 1, this.cx < 0 ? 1 : -U.sign(this.vx || 1));

      /* 낙사 */
      if (this.y > world.pxH + 60) { g.playerDied(); return; }

      /* 상태 */
      if (!this.onGround) this.state = this.vy < 0 ? 'jump' : 'fall';
      else if (ducking) this.state = 'duck';
      else if (Math.abs(this.vx) > 0.4) this.state = 'run';
      else this.state = 'idle';

      // 빠르게 달릴 때 먼지
      if (fast && this.onGround && Math.abs(this.vx) > 4 && this.tick % 4 === 0)
        g.puff(this.cx - this.facing * 12, this.y + this.h, 1, '#cdefff');
    }

    shoot(g, aimUp) {
      const big = this.power.powerShot > 0;
      const sx = this.cx + this.facing * 16;
      const sy = aimUp ? this.y + 6 : this.y + this.h * 0.42;
      const spd = big ? 11 : 9.5;
      const mk = (vx, vy) => g.add(new Shot(sx, sy, vx, vy, true, big));
      if (aimUp) {
        mk(0, -spd);
        if (big) { mk(-2.6, -spd * 0.95); mk(2.6, -spd * 0.95); }
      } else {
        mk(this.facing * spd, 0);
        if (big) { mk(this.facing * spd * 0.94, -2.4); mk(this.facing * spd * 0.94, 2.4); }
      }
      KK.audio.sfx(big ? 'powershot' : 'shoot');
      this.vx -= this.facing * (big ? 0.55 : 0.25);
      g.puff(sx, sy, 2, '#fff0b0');
    }

    hurt(g, dmg, knockDir) {
      if (this.iframe > 0 || this.invincible || this.deadTimer > 0) return false;
      this.hp -= dmg;
      this.iframe = P.IFRAME;
      this.hurtLock = 18;
      this.vx = (knockDir || -this.facing) * 4.2;
      this.vy = -6.4;
      g.onPlayerHit();
      KK.audio.sfx('hurt');
      g.cam.addShake(8);
      if (this.hp <= 0) g.playerDied();
      return true;
    }

    heal(n) { this.hp = Math.min(this.maxHp, this.hp + n); }

    grant(kind) {
      switch (kind) {
        case 'star':  this.power.invincible = 9 * 60; break;
        case 'bolt':  this.power.speedy = 10 * 60; break;
        case 'wing':  this.power.flying = 9 * 60; this.extraJump = true; break;
        case 'gun':   this.power.powerShot = 11 * 60; break;
        case 'heart': this.heal(1); break;
      }
    }

    draw(ctx, view) {
      if (this.iframe > 0 && Math.floor(this.tick / 4) % 2 === 0 && this.deadTimer <= 0) return;
      const dw = 50, dh = 54;
      const opt = {
        tick: this.tick, state: this.deadTimer > 0 ? 'jump' : this.state,
        invincible: this.power.invincible > 0,
        speedy: this.power.speedy > 0 && Math.abs(this.vx) > 3,
        flying: this.power.flying > 0,
        powerShot: this.power.powerShot > 0,
        aimUp: KK.input.held('up') && this.deadTimer <= 0
      };
      atFeet(ctx, this, view, dw, dh, (c, w, h) => S.kkukkuki(c, w, h, opt));
    }
  }

  /* ============================================================
     적 공통
     ============================================================ */
  class Enemy extends Entity {
    constructor(x, y, w, h) {
      super(x, y, w, h);
      this.type = 'enemy';
      this.hp = 1; this.score = 100;
      this.stompable = true;
      this.hitFlash = 0;
      this.contactDmg = 1;
    }
    damage(g, n, from) {
      if (this.dead) return;
      this.hp -= n;
      this.hitFlash = 8;
      if (this.hp <= 0) this.die(g);
      else KK.audio.sfx('bump');
    }
    die(g) {
      if (this.dead) return;
      this.dead = true;
      g.onEnemyKilled(this);
      g.burst(this.cx, this.cy, 14, '#ffd45e');
      KK.audio.sfx('enemyDie');
    }
    baseUpdate(g, dt) {
      this.tick++;
      if (this.hitFlash > 0) this.hitFlash -= dt;
      if (this.y > g.world.pxH + 120) this.dead = true;
    }
    flash(ctx, fn) {
      if (this.hitFlash > 0) {
        ctx.save(); ctx.globalAlpha = 0.9; fn(); ctx.restore();
      } else fn();
    }
  }

  /* ── 고양이 : 순찰하다가 총을 쏜다 ────────────── */
  class Cat extends Enemy {
    constructor(x, y) {
      super(x + 3, y - 4, 30, 40);
      this.score = 120;
      this.speed = 0.95;
      this.facing = -1;
      this.shootTimer = U.randInt(60, 150);
      this.windup = 0;
    }
    update(g, dt) {
      this.baseUpdate(g, dt);
      if (this.dead) return;
      const pl = g.player;
      const dx = pl.cx - this.cx, dy = Math.abs(pl.cy - this.cy);
      const sees = Math.abs(dx) < 460 && dy < 80;

      if (this.windup > 0) {
        this.windup -= dt; this.vx = 0;
        if (this.windup <= 0) {
          g.add(new Shot(this.cx + this.facing * 22, this.y + this.h * 0.55, this.facing * 4.4, 0, false));
          KK.audio.sfx('shoot');
          this.shootTimer = U.randInt(90, 150);
        }
      } else {
        if (sees && this.shootTimer <= 0) {
          this.facing = dx > 0 ? 1 : -1;
          this.windup = 26;
        } else {
          this.vx = this.speed * this.facing;
          if (this.wallHit || (this.onGround && this.edgeAhead(g.world, this.facing))) this.facing *= -1;
        }
      }
      if (this.shootTimer > 0) this.shootTimer -= dt;
      this.physics(g.world, dt);
    }
    draw(ctx, view) {
      atFeet(ctx, this, view, 46, 52, (c, w, h) =>
        S.cat(c, w, h, { tick: this.tick, charging: this.windup > 0 }));
    }
  }

  /* ── 강아지 : 돌진 + 2연발 ─────────────────────── */
  class Dog extends Enemy {
    constructor(x, y) {
      super(x + 1, y - 4, 34, 40);
      this.hp = 2; this.score = 180;
      this.speed = 1.25;
      this.facing = -1;
      this.charge = 0;
      this.chargeCd = 0;
      this.shootTimer = U.randInt(80, 170);
      this.burst = 0;
    }
    update(g, dt) {
      this.baseUpdate(g, dt);
      if (this.dead) return;
      const pl = g.player;
      const dx = pl.cx - this.cx, dy = Math.abs(pl.cy - this.cy);
      const sees = Math.abs(dx) < 460 && dy < 90;

      if (this.chargeCd > 0) this.chargeCd -= dt;
      if (this.shootTimer > 0) this.shootTimer -= dt;

      if (this.charge > 0) {
        this.charge -= dt;
        this.vx = this.facing * 3.4;
        if (this.wallHit || (this.onGround && this.edgeAhead(g.world, this.facing))) { this.charge = 0; this.chargeCd = 70; }
        if (this.tick % 6 === 0) g.puff(this.cx - this.facing * 14, this.y + this.h, 1, '#e8d9c0');
      } else if (this.burst > 0) {
        this.vx = 0;
        if (this.tick % 9 === 0) {
          this.burst -= 1;
          g.add(new Shot(this.cx + this.facing * 24, this.y + this.h * 0.52, this.facing * 4.8, 0, false));
          KK.audio.sfx('shoot');
        }
      } else {
        if (sees && Math.abs(dx) < 210 && this.chargeCd <= 0) {
          this.facing = dx > 0 ? 1 : -1;
          this.charge = 72;
          KK.audio.sfx('bump');
        } else if (sees && this.shootTimer <= 0) {
          this.facing = dx > 0 ? 1 : -1;
          this.burst = 2; this.shootTimer = U.randInt(120, 200);
        } else {
          this.vx = this.speed * this.facing;
          if (this.wallHit || (this.onGround && this.edgeAhead(g.world, this.facing))) this.facing *= -1;
        }
      }
      this.physics(g.world, dt);
    }
    draw(ctx, view) {
      atFeet(ctx, this, view, 50, 52, (c, w, h) =>
        S.dog(c, w, h, { tick: this.tick, charging: this.charge > 0, shootReady: this.burst > 0 }));
    }
  }

  /* ── 새 : 날면서 폭탄 투하 ─────────────────────── */
  class Bird extends Enemy {
    constructor(x, y) {
      super(x, y, 40, 30);
      this.score = 150;
      this.baseY = y;
      this.gravity = 0; this.solidBody = false;
      this.amp = U.rand(24, 54);
      this.phase = Math.random() * Math.PI * 2;
      this.bombTimer = U.randInt(70, 150);
      this.homeX = x;
      this.facing = -1;
    }
    update(g, dt) {
      this.baseUpdate(g, dt);
      if (this.dead) return;
      const pl = g.player;
      const dx = pl.cx - this.cx;
      // 플레이어 쪽으로 천천히 이동하되 원래 자리 근처를 배회
      const wander = Math.abs(dx) < 520 ? U.sign(dx) * 0.85 : U.sign(this.homeX - this.cx) * 0.5;
      this.vx = U.approach(this.vx, wander, 0.05 * dt);
      this.facing = this.vx > 0.05 ? 1 : (this.vx < -0.05 ? -1 : this.facing);
      const nx = this.x + this.vx * dt;
      if (g.world.solidAtPx(nx + this.w / 2, this.cy)) { this.vx *= -0.6; this.homeX = this.cx; }
      else this.x = nx;
      this.phase += 0.045 * dt;
      this.y = this.baseY + Math.sin(this.phase) * this.amp;

      if (this.bombTimer > 0) this.bombTimer -= dt;
      if (this.bombTimer <= 0 && Math.abs(dx) < 190 && pl.cy > this.cy) {
        g.add(new Bomb(this.cx - 9, this.y + this.h));
        this.bombTimer = U.randInt(120, 200);
        KK.audio.sfx('bump');
      }
    }
    draw(ctx, view) {
      atFeet(ctx, this, view, 52, 40, (c, w, h) =>
        S.bird(c, w, h, { tick: this.tick, holdingBomb: this.bombTimer < 34 }));
    }
  }

  /* ── 고릴라 : 높은 곳에서 드럼통을 던진다 ──────── */
  class Gorilla extends Enemy {
    constructor(x, y, boss = false) {
      super(x - (boss ? 20 : 6), y - (boss ? 46 : 22), boss ? 72 : 52, boss ? 84 : 62);
      this.boss = boss;
      this.hp = boss ? 16 : 5;
      this.maxHp = this.hp;
      this.score = boss ? 2500 : 400;
      this.stompable = true;
      this.throwTimer = boss ? 90 : U.randInt(80, 160);
      this.windup = 0;
      this.homeX = this.x;
      this.rage = false;
      this.slamTimer = boss ? 240 : 0;
      this.contactDmg = 1;
    }
    damage(g, n, from) {
      super.damage(g, n, from);
      if (this.boss && !this.dead) {
        g.cam.addShake(3);
        if (this.hp <= this.maxHp / 2 && !this.rage) {
          this.rage = true;
          KK.audio.sfx('boss');
          g.toast('고릴라가 화났다!');
        }
      }
    }
    update(g, dt) {
      this.baseUpdate(g, dt);
      if (this.dead) return;
      const pl = g.player;
      const dx = pl.cx - this.cx;
      this.facing = dx > 0 ? 1 : -1;
      const near = Math.abs(dx) < (this.boss ? 900 : 700);

      if (this.boss) {
        // 보스는 아레나 안을 천천히 걸어다닌다
        const spd = this.rage ? 1.5 : 0.9;
        if (this.windup <= 0 && this.slamTimer > 40) {
          this.vx = U.approach(this.vx, U.sign(dx) * spd, 0.08 * dt);
          if (this.wallHit || (this.onGround && this.edgeAhead(g.world, U.sign(this.vx) || 1))) this.vx = 0;
        } else this.vx = U.approach(this.vx, 0, 0.3 * dt);

        this.slamTimer -= dt;
        if (this.slamTimer <= 0 && this.onGround) {
          this.vy = -11;                 // 점프 후 착지 충격파
          this.slamTimer = this.rage ? 200 : 300;
          this.slamPending = true;
        }
        if (this.slamPending && this.onGround && this.landedVy > 6) {
          this.slamPending = false;
          g.cam.addShake(16);
          KK.audio.sfx('explode');
          g.burst(this.cx, this.y + this.h, 20, '#c8a06a');
          for (const s of [-1, 1]) g.add(new Shockwave(this.cx, this.y + this.h - 8, s * 5.2));
        }
      } else {
        this.vx = U.approach(this.vx, 0, 0.2 * dt);
      }

      /* 드럼통 던지기 */
      if (near) {
        if (this.windup > 0) {
          this.windup -= dt;
          if (this.windup <= 0) {
            const n = (this.boss && this.rage) ? 2 : 1;
            for (let i = 0; i < n; i++) {
              const b = new Barrel(this.cx + this.facing * 20 - 16, this.y + 6);
              b.vx = this.facing * (2.2 + i * 0.7);
              b.vy = -4.5 - i * 1.2;
              g.add(b);
            }
            KK.audio.sfx('barrel');
            this.throwTimer = this.boss ? (this.rage ? 100 : 150) : U.randInt(130, 210);
          }
        } else {
          if (this.throwTimer > 0) this.throwTimer -= dt;
          else this.windup = 40;
        }
      }
      this.physics(g.world, dt);
    }
    draw(ctx, view) {
      const dw = this.boss ? 96 : 68, dh = this.boss ? 100 : 74;
      atFeet(ctx, this, view, dw, dh, (c, w, h) =>
        S.gorilla(c, w, h, {
          tick: this.tick, rage: this.rage,
          windup: this.windup > 0 ? 1 - this.windup / 40 : 0
        }));
      if (this.boss) this.drawHpBar(ctx, view);
    }
    drawHpBar(ctx, view) {
      const w = 104, x = this.cx - view.x - w / 2, y = this.y - view.y - 34;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.55)'; U.roundRect(ctx, x, y, w, 12, 6); ctx.fill();
      ctx.fillStyle = this.rage ? '#ff5b5b' : '#ffd23f';
      U.roundRect(ctx, x + 2, y + 2, (w - 4) * Math.max(0, this.hp / this.maxHp), 8, 4); ctx.fill();
      ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.fillText('KING GORILLA', x + w / 2, y - 5);
      ctx.restore();
    }
  }

  /* ── 드럼통 : 굴러온다. 총으로 못 부순다 → 점프! ── */
  class Barrel extends Entity {
    constructor(x, y) {
      super(x, y, 32, 34);
      this.type = 'hazard';
      this.rot = 0;
      this.life = 16 * 60;
      this.gravity = 0.55;
      this.contactDmg = 1;
      this.bounces = 0;
    }
    update(g, dt) {
      this.tick++;
      this.life -= dt;
      if (this.life <= 0) { this.pop(g); return; }

      const wasAir = !this.onGround;
      this.physics(g.world, dt);

      if (this.onGround) {
        if (wasAir && this.landedVy > 5.5 && this.bounces < 4) {
          this.vy = -this.landedVy * 0.34; this.bounces++;
          KK.audio.sfx('barrel');
          g.puff(this.cx, this.y + this.h, 3, '#d8bb8a');
        }
        // 굴러가는 속도 유지
        const target = U.sign(this.vx || 1) * 3.2;
        this.vx = U.approach(this.vx, target, 0.06 * dt);
      }
      if (this.wallHit) { this.vx = -this.wallHit * 2.6; KK.audio.sfx('bump'); }

      this.rot += this.vx * 0.055 * dt;
      if (this.y > g.world.pxH + 100) this.dead = true;
    }
    pop(g) {
      if (this.dead) return;
      this.dead = true;
      g.burst(this.cx, this.cy, 12, '#b07a3a');
      KK.audio.sfx('break');
    }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.y + this.h - view.y));
      S.barrel(ctx, this.w * 1.05, this.h * 1.05, { rot: this.rot });
      ctx.restore();
    }
  }

  /* ── 충격파 (보스 착지) ────────────────────────── */
  class Shockwave extends Entity {
    constructor(x, y, vx) {
      super(x - 14, y - 26, 28, 28);
      this.type = 'hazard';
      this.vx = vx; this.gravity = 0; this.solidBody = false;
      this.life = 100; this.contactDmg = 1;
    }
    update(g, dt) {
      this.tick++;
      this.life -= dt;
      this.x += this.vx * dt;
      // 땅을 따라 붙어 다닌다
      const c = Math.floor(this.cx / T);
      let r = Math.floor((this.y + this.h) / T);
      if (!g.world.isSolid(c, r) && !g.world.isSolid(c, r + 1)) { this.dead = true; return; }
      if (g.world.isSolid(c, r - 1)) this.dead = true;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx, view) {
      const x = this.cx - view.x, y = this.y + this.h - view.y;
      const a = U.clamp(this.life / 100, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#e8c88a';
      ctx.beginPath();
      ctx.moveTo(x - 16, y);
      ctx.lineTo(x, y - 30 * a);
      ctx.lineTo(x + 16, y);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ── 폭탄 (새가 떨어뜨림) ──────────────────────── */
  class Bomb extends Entity {
    constructor(x, y) {
      super(x, y, 20, 20);
      this.type = 'hazard';
      this.gravity = 0.42;
      this.fuse = 150;
      this.contactDmg = 1;
    }
    update(g, dt) {
      this.tick++;
      this.fuse -= dt;
      this.physics(g.world, dt);
      if (this.onGround) { this.vx *= 0.85; this.fuse = Math.min(this.fuse, 34); }
      if (this.fuse <= 0 || this.y > g.world.pxH + 60) this.explode(g);
    }
    explode(g) {
      if (this.dead) return;
      this.dead = true;
      g.add(new Explosion(this.cx, this.cy));
      g.burst(this.cx, this.cy, 20, '#ff9a3c');
      g.cam.addShake(9);
      KK.audio.sfx('explode');
    }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.y + this.h - view.y));
      const s = this.fuse < 40 ? 1 + Math.sin(this.tick * 0.8) * 0.12 : 1;
      ctx.scale(s, s);
      S.bomb(ctx, this.w * 1.35, this.h * 1.35, { tick: this.tick });
      ctx.restore();
    }
  }

  class Explosion extends Entity {
    constructor(x, y) {
      super(x - 46, y - 46, 92, 92);
      this.type = 'hazard';
      this.gravity = 0; this.solidBody = false;
      this.life = 22; this.contactDmg = 1;
    }
    update(g, dt) {
      this.tick++;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx, view) {
      const p = 1 - this.life / 22;
      const r = 18 + p * 46;
      const x = this.cx - view.x, y = this.cy - view.y;
      ctx.save();
      ctx.globalAlpha = 1 - p * 0.85;
      const g2 = ctx.createRadialGradient(x, y, 2, x, y, r);
      g2.addColorStop(0, '#fff6d0'); g2.addColorStop(0.45, '#ffb03a'); g2.addColorStop(1, 'rgba(220,60,20,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  /* ── 탄환 ──────────────────────────────────────── */
  class Shot extends Entity {
    constructor(x, y, vx, vy, fromPlayer, big = false) {
      const s = big ? 16 : (fromPlayer ? 13 : 12);
      super(x - s / 2, y - s / 2, s, s);
      this.type = fromPlayer ? 'pshot' : 'eshot';
      this.vx = vx; this.vy = vy;
      this.gravity = 0; this.solidBody = false;
      this.fromPlayer = fromPlayer;
      this.big = big;
      this.life = fromPlayer ? 70 : 200;
      this.dmg = big ? 2 : 1;
      this.facing = vx >= 0 ? 1 : -1;
    }
    update(g, dt) {
      this.tick++;
      this.life -= dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.life <= 0) { this.dead = true; return; }

      const c = Math.floor(this.cx / T), r = Math.floor(this.cy / T);
      if (g.world.isSolid(c, r)) {
        if (this.fromPlayer) {
          const broke = g.hitBlock(c, r, 'shot');
          if (!broke) { g.puff(this.cx, this.cy, 3, '#ffe6a0'); KK.audio.sfx('bump'); }
        } else g.puff(this.cx, this.cy, 3, '#a8e4ff');
        this.dead = true;
      }
    }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.cy + this.h / 2 - view.y));
      if (this.fromPlayer) S.playerShot(ctx, this.w * 1.6, this.h * 1.4, { tick: this.tick, big: this.big });
      else S.enemyShot(ctx, this.w * 1.5, this.h * 1.5);
      ctx.restore();
    }
  }

  /* ── 아이템 ────────────────────────────────────── */
  const ITEM_INFO = {
    star:  { label: '무적!', color: '#ffd23f' },
    bolt:  { label: '스피드 업!', color: '#5ed7ff' },
    wing:  { label: '날개!', color: '#b58cff' },
    gun:   { label: '파워 샷!', color: '#ff7a5c' },
    heart: { label: '체력 회복!', color: '#ff5f7e' }
  };
  KK.ITEM_INFO = ITEM_INFO;

  class Item extends Entity {
    constructor(x, y, kind) {
      super(x, y, 28, 28);
      this.type = 'item';
      this.kind = kind;
      this.gravity = 0.4;
      this.emerge = 22;     // 상자에서 솟아나는 연출
      this.vy = -3.4;
      this.vx = 0;
      this.life = 60 * 20;
    }
    update(g, dt) {
      this.tick++;
      this.life -= dt;
      if (this.life <= 0) { this.dead = true; return; }
      if (this.emerge > 0) {
        this.emerge -= dt;
        this.y -= 1.6 * dt;
        return;
      }
      if (this.kind === 'star' || this.kind === 'bolt') {
        // 통통 튀며 굴러간다
        if (this.vx === 0) this.vx = 1.6;
        if (this.onGround) this.vy = -5.2;
        if (this.wallHit) this.vx *= -1;
      }
      this.physics(g.world, dt);
      if (this.y > g.world.pxH + 60) this.dead = true;
    }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.y + this.h - view.y));
      S.item(ctx, this.w * 1.5, this.h * 1.5, { tick: this.tick, kind: this.kind });
      ctx.restore();
    }
  }

  /* ── 코인(꾹꾹이 열매) ─────────────────────────── */
  class Coin extends Entity {
    constructor(x, y) {
      super(x + 7, y + 6, 22, 24);
      this.type = 'coin';
      this.gravity = 0; this.solidBody = false;
      this.tick = (x + y) % 60;
    }
    update(g, dt) { this.tick++; }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.y + this.h - view.y));
      S.coin(ctx, 26, 26, { tick: this.tick });
      ctx.restore();
    }
  }

  /* ── 체크포인트 ────────────────────────────────── */
  class Checkpoint extends Entity {
    constructor(x, y) {
      super(x + 8, y - 30, 20, 66);
      this.type = 'checkpoint';
      this.gravity = 0; this.solidBody = false;
      this.active = false;
    }
    update(g, dt) { this.tick++; }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.y + this.h - view.y));
      S.checkpoint(ctx, 34, this.h, { tick: this.tick, active: this.active });
      ctx.restore();
    }
  }

  /* ── 골 깃발 ───────────────────────────────────── */
  class Goal extends Entity {
    constructor(x, y) {
      super(x + 6, y - 78, 24, 114);
      this.type = 'goal';
      this.gravity = 0; this.solidBody = false;
      this.cleared = false;
    }
    update(g, dt) { this.tick++; }
    draw(ctx, view) {
      ctx.save();
      ctx.translate(Math.round(this.cx - view.x), Math.round(this.y + this.h - view.y));
      S.flag(ctx, 44, this.h, { tick: this.tick, cleared: this.cleared });
      ctx.restore();
    }
  }

  /* ── 파티클 / 점수 텍스트 ─────────────────────── */
  class Particle {
    constructor(x, y, vx, vy, color, life, size, grav = 0.28) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.color = color; this.life = life; this.maxLife = life;
      this.size = size; this.grav = grav; this.dead = false;
      this.rot = Math.random() * 6.28; this.vr = U.rand(-0.3, 0.3);
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) { this.dead = true; return; }
      this.vy += this.grav * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= 0.985; this.rot += this.vr * dt;
    }
    draw(ctx, view) {
      const a = U.clamp(this.life / this.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(this.x - view.x, this.y - view.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = this.color;
      const s = this.size * (0.5 + a * 0.5);
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }

  class FloatText {
    constructor(x, y, text, color = '#fff') {
      this.x = x; this.y = y; this.text = text; this.color = color;
      this.life = 60; this.dead = false;
    }
    update(dt) { this.life -= dt; this.y -= 0.75 * dt; if (this.life <= 0) this.dead = true; }
    draw(ctx, view) {
      const a = U.clamp(this.life / 60, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = 'bold 17px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)';
      ctx.strokeText(this.text, this.x - view.x, this.y - view.y);
      ctx.fillStyle = this.color;
      ctx.fillText(this.text, this.x - view.x, this.y - view.y);
      ctx.restore();
    }
  }

  /* ── 스폰 문자 → 엔티티 ───────────────────────── */
  function spawnFromChar(sp) {
    const { ch, x, y } = sp;
    switch (ch) {
      case 'C': return new Coin(x, y);
      case 'K': return new Checkpoint(x, y);
      case 'G': return new Goal(x, y);
      case '1': return new Cat(x, y);
      case '2': return new Dog(x, y);
      case '3': return new Bird(x, y);
      case '4': return new Gorilla(x, y);
      case '5': return new Gorilla(x, y, true);
    }
    return null;
  }

  KK.ent = {
    Entity, Player, Enemy, Cat, Dog, Bird, Gorilla,
    Barrel, Bomb, Explosion, Shockwave, Shot,
    Item, Coin, Checkpoint, Goal, Particle, FloatText,
    spawnFromChar
  };

})(window);

/* ===== js/game.js ===== */
/* ============================================================
   꾹꾹이의 대모험 — game.js
   게임 루프 / 상태 전환 / 충돌 판정 / 퀘스트 / HUD
   ============================================================ */
(function (global) {
  'use strict';
  const KK = global.KK;
  const U = KK.util;
  const E = KK.ent;
  const S = KK.sprites;
  const T = KK.TILE;

  const SAVE_KEY = 'kkukkuki-save-v1';

  /* ── 텍스트 헬퍼 ───────────────────────────────── */
  function text(ctx, str, x, y, opt = {}) {
    ctx.save();
    ctx.font = `${opt.weight || 'bold'} ${opt.size || 18}px "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif`;
    ctx.textAlign = opt.align || 'left';
    ctx.textBaseline = opt.baseline || 'alphabetic';
    if (opt.stroke !== false) {
      ctx.lineWidth = opt.strokeW || 5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = opt.strokeColor || 'rgba(0,0,0,.6)';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = opt.color || '#fff';
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function panel(ctx, x, y, w, h, r = 14, fill = 'rgba(12,18,32,.78)') {
    ctx.save();
    U.roundRect(ctx, x, y, w, h, r);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function heartIcon(ctx, x, y, r, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.75);
    ctx.bezierCurveTo(-r * 1.5, -r * 0.25, -r * 0.5, -r * 1.25, 0, -r * 0.4);
    ctx.bezierCurveTo(r * 0.5, -r * 1.25, r * 1.5, -r * 0.25, 0, r * 0.75);
    ctx.closePath();
    ctx.fillStyle = filled ? '#ff4d6d' : 'rgba(255,255,255,.18)';
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     Game
     ============================================================ */
  class Game {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.tick = 0;
      this.state = 'title';
      this.menuIndex = 0;
      this.stageIndex = 0;
      this.selIndex = 0;
      this.lives = 3;
      this.score = 0;
      this.toastMsg = null; this.toastTimer = 0;
      this.transition = 0;
      this.save = this.loadSave();
      this.fadeIn = 0;
      this._titleWorld = null;
      this.resize();
      const onResize = () => this.resize();
      global.addEventListener('resize', onResize);
      global.addEventListener('orientationchange', () => setTimeout(onResize, 260));
      if (global.visualViewport) global.visualViewport.addEventListener('resize', onResize);
      // 화면을 벗어나면(전화·알림 등) 자동 일시정지
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && this.state === 'play') { this.state = 'pause'; KK.audio.stopMusic(); }
      });
    }

    /* ── 저장 ────────────────────────────────────── */
    loadSave() {
      try {
        const raw = global.localStorage.getItem(SAVE_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s && typeof s === 'object') {
            s.unlocked = s.unlocked || 1;
            s.stars = s.stars || {};
            s.best = s.best || {};
            return s;
          }
        }
      } catch (e) { /* 저장 불가 환경(사파리 시크릿 등)은 조용히 무시 */ }
      return { unlocked: 1, stars: {}, best: {} };
    }
    writeSave() {
      try { global.localStorage.setItem(SAVE_KEY, JSON.stringify(this.save)); } catch (e) {}
    }

    resize() {
      const touch = KK.isTouch;
      // #stage 의 안쪽 크기를 쓰면 노치·홈 인디케이터 안전영역이 자동 반영된다
      const stage = document.getElementById('stage');
      let availW = global.innerWidth, availH = global.innerHeight;
      if (stage) {
        const cs = getComputedStyle(stage);
        availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      }
      availW -= touch ? 0 : 20;
      availH -= touch ? 0 : 42;
      const scale = Math.min(availW / KK.W, availH / KK.H, touch ? 6 : 1.6);
      this.canvas.style.width = Math.floor(KK.W * scale) + 'px';
      this.canvas.style.height = Math.floor(KK.H * scale) + 'px';
    }

    /* ── 스테이지 로드 ───────────────────────────── */
    loadStage(i, keepScore = true) {
      this.stageIndex = U.clamp(i, 0, KK.LEVELS.length - 1);
      const def = KK.LEVELS[this.stageIndex];
      this.def = def;
      this.world = new KK.World(def);
      this.cam = new KK.Camera(this.world);
      this.entities = [];
      this.particles = [];
      this.texts = [];
      this.player = new E.Player(this.world.start.x, this.world.start.y);
      this.spawnPoint = { x: this.player.x, y: this.player.y };

      for (const sp of this.world.spawns) {
        const e = E.spawnFromChar(sp);
        if (e) this.entities.push(e);
      }
      this.totalCoins = this.entities.filter(e => e.type === 'coin').length;
      this.totalEnemies = this.entities.filter(e => e.type === 'enemy').length;

      if (!keepScore) this.score = 0;
      this.stageCoins = 0;
      this.stageKills = 0;
      this.stageHits = 0;
      this.bossKilled = false;
      this.timeLeft = def.timeLimit;
      this.elapsed = 0;
      this.cam.follow(this.player, true);
      this.cam.update();

      KK.audio.playMusic(KK.SONGS[def.song] || KK.SONGS.forest);
      this.state = 'intro';
      this.introTimer = 150;
      this.fadeIn = 30;
    }

    /* ── 편의 함수 ───────────────────────────────── */
    add(e) { this.entities.push(e); return e; }
    toast(msg, ms = 110) { this.toastMsg = msg; this.toastTimer = ms; }

    puff(x, y, n, color) {
      for (let i = 0; i < n; i++)
        this.particles.push(new E.Particle(x, y, U.rand(-1.2, 1.2), U.rand(-1.8, -0.2), color, U.randInt(16, 30), U.rand(3, 6), 0.12));
    }
    burst(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = U.rand(1.2, 4.6);
        this.particles.push(new E.Particle(x, y, Math.cos(a) * s, Math.sin(a) * s - 1.4, color, U.randInt(22, 46), U.rand(3, 7)));
      }
    }
    float(x, y, str, color) { this.texts.push(new E.FloatText(x, y, str, color)); }

    addScore(n, x, y, color) {
      this.score += n;
      if (x !== undefined) this.float(x, y, '+' + n, color || '#ffe27a');
    }

    /* ── 블록 파괴 ───────────────────────────────── */
    hitBlock(c, r, source) {
      const ch = this.world.at(c, r);
      if (ch === 'B') {
        this.world.set(c, r, '.');
        const px = c * T + T / 2, py = r * T + T / 2;
        for (let i = 0; i < 10; i++) {
          const a = Math.random() * Math.PI * 2;
          this.particles.push(new E.Particle(px, py, Math.cos(a) * U.rand(1, 4), Math.sin(a) * U.rand(1, 4) - 2, '#c1603a', U.randInt(24, 44), U.rand(5, 9)));
        }
        KK.audio.sfx('break');
        this.addScore(30, px, py - 6, '#ffb98a');
        return true;
      }
      if (ch === '?') {
        this.world.set(c, r, 'X');
        this.world.bump(c, r, -1);
        const kind = this.rollItem();
        this.add(new E.Item(c * T + 4, r * T - 6, kind));
        KK.audio.sfx('power');
        return true;
      }
      this.world.bump(c, r, -1);
      return false;
    }

    rollItem() {
      const p = this.player;
      if (p.hp <= 1 && Math.random() < 0.55) return 'heart';
      const pool = ['star', 'bolt', 'wing', 'gun', 'gun', 'bolt', 'wing', 'heart'];
      return U.choice(pool);
    }

    /* ── 이벤트 콜백 ─────────────────────────────── */
    onEnemyKilled(en) {
      this.stageKills++;
      const p = this.player;
      p.combo = Math.min(8, p.combo + 1);
      p.comboTimer = 120;
      const mult = p.combo;
      const gain = en.score * mult;
      this.addScore(gain, en.cx, en.y, mult > 1 ? '#ff9de2' : '#ffe27a');
      if (mult > 1) this.float(en.cx, en.y - 20, '콤보 x' + mult, '#ff9de2');
      if (en.boss) {
        this.bossKilled = true;
        this.cam.addShake(20);
        this.toast('보스 격파!');
      }
    }
    onPlayerHit() { this.stageHits++; }

    playerDied() {
      if (this.state === 'dying') return;
      this.state = 'dying';
      this.player.deadTimer = 110;
      this.player.vy = -11;
      this.player.vx = 0;
      KK.audio.stopMusic();
      KK.audio.sfx('gameover');
    }

    respawn() {
      this.lives--;
      if (this.lives < 0) {
        this.state = 'gameover';
        return;
      }
      const p = this.player;
      p.x = this.spawnPoint.x; p.y = this.spawnPoint.y;
      p.vx = p.vy = 0;
      p.hp = p.maxHp;
      p.deadTimer = 0;
      p.iframe = 90;
      p.power = { invincible: 0, speedy: 0, flying: 0, powerShot: 0 };
      this.timeLeft = Math.max(this.timeLeft, 45);
      this.cam.follow(p, true);
      this.state = 'play';
      this.fadeIn = 24;
      KK.audio.playMusic(KK.SONGS[this.def.song]);
    }

    /* ── 퀘스트 판정 ─────────────────────────────── */
    questResults() {
      return this.def.quests.map(q => {
        let done = false, cur = 0;
        switch (q.kind) {
          case 'coins': cur = this.stageCoins; done = cur >= q.target; break;
          case 'kills': cur = this.stageKills; done = cur >= q.target; break;
          case 'time':  cur = Math.floor(this.elapsed); done = this.elapsed <= q.target; break;
          case 'nohit': cur = this.stageHits; done = this.stageHits === 0; break;
          case 'boss':  cur = this.bossKilled ? 1 : 0; done = this.bossKilled; break;
        }
        return { q, done, cur };
      });
    }

    stageClear() {
      if (this.state === 'clear') return;
      this.state = 'clear';
      this.results = this.questResults();
      this.stars = this.results.filter(r => r.done).length;
      const bonus = Math.floor(this.timeLeft) * 12 + this.stars * 800;
      this.clearBonus = bonus;
      this.score += bonus;

      const id = this.def.id;
      this.save.stars[id] = Math.max(this.save.stars[id] || 0, this.stars);
      this.save.best[id] = Math.max(this.save.best[id] || 0, this.score);
      this.save.unlocked = Math.max(this.save.unlocked, Math.min(KK.LEVELS.length, id + 1));
      this.writeSave();

      KK.audio.stopMusic();
      KK.audio.sfx('clear');
      this.clearTimer = 0;
    }

    /* ── 메인 업데이트 ───────────────────────────── */
    update(dt) {
      this.tick++;
      const inp = KK.input;

      if (this.toastTimer > 0) this.toastTimer -= dt;
      if (this.fadeIn > 0) this.fadeIn -= dt;

      if (inp.hit('music')) {
        const on = KK.audio.toggleMusic();
        this.toast(on ? '음악 켬' : '음악 끔');
      }

      switch (this.state) {
        case 'title':    this.updateTitle(dt); break;
        case 'select':   this.updateSelect(dt); break;
        case 'howto':    if (this.confirm()) { KK.audio.sfx('select'); this.state = 'title'; } break;
        case 'intro':
          this.introTimer -= dt;
          if (this.introTimer <= 0 || this.confirm()) this.state = 'play';
          this.updateWorld(dt * 0.25);
          break;
        case 'play':     this.updatePlay(dt); break;
        case 'pause':
          if (inp.hit('pause') || this.confirm()) { this.state = 'play'; KK.audio.sfx('select'); }
          if (inp.hit('restart')) { KK.audio.sfx('select'); this.loadStage(this.stageIndex, false); }
          break;
        case 'dying':
          this.updateWorld(dt);
          this.player.update(this, dt);
          if (this.player.deadTimer <= 0) this.respawn();
          break;
        case 'clear':
          this.clearTimer += dt;
          this.updateWorld(dt * 0.4);
          if (this.clearTimer > 40 && this.confirm()) {
            if (this.stageIndex + 1 < KK.LEVELS.length) this.loadStage(this.stageIndex + 1);
            else { this.state = 'allclear'; this.allTimer = 0; }
          }
          break;
        case 'gameover':
          if (this.confirm()) { this.lives = 3; this.score = 0; this.loadStage(this.stageIndex, false); }
          break;
        case 'allclear':
          this.allTimer = (this.allTimer || 0) + dt;
          if (this.allTimer > 60 && this.confirm()) { this.state = 'title'; this.lives = 3; this.score = 0; }
          break;
      }
    }

    confirm() {
      const inp = KK.input;
      return inp.hit('start') || inp.hit('jump') || inp.hit('shoot');
    }

    updateTitle(dt) {
      const inp = KK.input;
      const items = 3;
      if (inp.hit('up')) { this.menuIndex = (this.menuIndex + items - 1) % items; KK.audio.sfx('select'); }
      if (inp.hit('down')) { this.menuIndex = (this.menuIndex + 1) % items; KK.audio.sfx('select'); }
      if (this.confirm()) {
        KK.audio.sfx('select');
        if (this.menuIndex === 0) { this.lives = 3; this.score = 0; this.loadStage(0, false); }
        else if (this.menuIndex === 1) { this.state = 'select'; this.selIndex = 0; }
        else this.state = 'howto';
      }
    }

    updateSelect(dt) {
      const inp = KK.input;
      const n = KK.LEVELS.length;
      if (inp.hit('left')) { this.selIndex = (this.selIndex + n - 1) % n; KK.audio.sfx('select'); }
      if (inp.hit('right')) { this.selIndex = (this.selIndex + 1) % n; KK.audio.sfx('select'); }
      if (inp.hit('pause')) { this.state = 'title'; return; }
      if (this.confirm()) {
        if (this.selIndex + 1 <= this.save.unlocked) {
          KK.audio.sfx('select');
          this.lives = 3; this.score = 0;
          this.loadStage(this.selIndex, false);
        } else {
          KK.audio.sfx('bump');
          this.toast('아직 잠겨 있어요!');
        }
      }
    }

    updatePlay(dt) {
      const inp = KK.input;
      if (inp.hit('pause')) { this.state = 'pause'; KK.audio.sfx('select'); return; }
      if (inp.hit('restart')) { this.loadStage(this.stageIndex, false); return; }

      this.elapsed += dt / 60;
      this.timeLeft -= dt / 60;
      if (this.timeLeft <= 0) {
        this.timeLeft = 0;
        this.toast('시간 초과!');
        this.playerDied();
        return;
      }

      this.player.update(this, dt);
      this.updateWorld(dt);
      this.collisions();
      this.cam.follow(this.player);
      this.cam.update();
    }

    updateWorld(dt) {
      this.world.updateBumps();
      const cx = this.cam.x;
      for (const e of this.entities) {
        if (e.dead) continue;
        // 화면에서 아주 멀리 떨어진 적은 쉬게 한다(성능 + 난입 방지)
        const far = e.x < cx - 700 || e.x > cx + KK.W + 700;
        if (far && (e.type === 'enemy')) { e.tick++; continue; }
        e.update(this, dt);
      }
      for (const p of this.particles) p.update(dt);
      for (const t of this.texts) t.update(dt);
      this.entities = this.entities.filter(e => !e.dead);
      this.particles = this.particles.filter(p => !p.dead);
      this.texts = this.texts.filter(t => !t.dead);
    }

    /* ── 충돌 판정 ───────────────────────────────── */
    collisions() {
      const p = this.player;
      if (p.deadTimer > 0) return;

      for (const e of this.entities) {
        if (e.dead) continue;

        /* 플레이어 탄환 */
        if (e.type === 'pshot') {
          for (const t of this.entities) {
            if (t.dead || t === e) continue;
            if (t.type === 'enemy' && U.aabb(e, t)) {
              t.damage(this, e.dmg, e);
              this.puff(e.cx, e.cy, 4, '#ffd88a');
              e.dead = true;
              break;
            }
            // 드럼통: 보통 총알은 튕기고, 파워 샷은 부순다
            if (t instanceof E.Barrel && U.aabb(e, t)) {
              if (e.big) { t.pop(this); this.addScore(80, t.cx, t.cy, '#ffb98a'); }
              else { this.puff(e.cx, e.cy, 4, '#ffe6a0'); KK.audio.sfx('bump'); }
              e.dead = true;
              break;
            }
            if (t instanceof E.Bomb && U.aabb(e, t)) {
              t.explode(this);
              e.dead = true;
              break;
            }
          }
          continue;
        }

        if (!U.aabb(p, e)) continue;

        switch (e.type) {
          case 'coin':
            e.dead = true;
            this.stageCoins++;
            this.addScore(50, e.cx, e.y, '#ffe27a');
            KK.audio.sfx('coin');
            break;

          case 'item':
            if (e.emerge > 0) break;
            e.dead = true;
            p.grant(e.kind);
            {
              const info = KK.ITEM_INFO[e.kind];
              this.float(e.cx, e.y - 6, info.label, info.color);
              this.toast(info.label);
              this.burst(e.cx, e.cy, 14, info.color);
            }
            this.addScore(120);
            KK.audio.sfx('power');
            break;

          case 'checkpoint':
            if (!e.active) {
              e.active = true;
              this.spawnPoint = { x: e.x - 10, y: e.y + 10 };
              this.toast('체크포인트 통과!');
              this.addScore(200, e.cx, e.y, '#ffd23f');
              KK.audio.sfx('power');
            }
            break;

          case 'goal':
            e.cleared = true;
            this.stageClear();
            return;

          case 'eshot':
            e.dead = true;
            if (p.invincible) { this.puff(e.cx, e.cy, 5, '#ffd23f'); break; }
            p.hurt(this, 1, U.sign(e.vx) || 1);
            break;

          case 'hazard':
            if (p.invincible) {
              if (e instanceof E.Barrel) { e.pop(this); this.addScore(120, e.cx, e.cy, '#ffd23f'); }
              break;
            }
            // 드럼통은 밟아도 안 죽는다 → 반드시 점프로 피해야 함
            p.hurt(this, e.contactDmg || 1, U.sign(p.cx - e.cx) || 1);
            break;

          case 'enemy': {
            const stomping = p.vy > 0.5 && p.prevBottom <= e.y + 16;
            if (p.invincible) {
              e.damage(this, 99, p);
              this.cam.addShake(4);
              break;
            }
            if (stomping && e.stompable) {
              e.damage(this, e.boss ? 1 : 99, p);
              p.vy = KK.input.held('jump') ? -12 : -8.6;
              p.prevBottom = p.y + p.h;
              this.puff(p.cx, p.y + p.h, 6, '#ffffff');
              KK.audio.sfx('stomp');
              this.cam.addShake(3);
            } else {
              p.hurt(this, e.contactDmg || 1, U.sign(p.cx - e.cx) || 1);
            }
            break;
          }
        }
      }
    }

    /* ============================================================
       그리기
       ============================================================ */
    draw() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, KK.W, KK.H);

      const MENUS = ['title', 'select', 'howto', 'allclear'];
      if (MENUS.includes(this.state) || !this.world) {
        this.drawMenuBackground(ctx);
      } else {
        const view = { x: this.cam.vx, y: this.cam.vy };
        this.world.drawBackground(ctx, view, this.tick);
        this.world.draw(ctx, view, this.tick);

        // 뒤쪽(코인·아이템·깃발) → 앞쪽(적·탄환) 순서
        const order = { coin: 0, checkpoint: 0, goal: 0, item: 1, enemy: 2, hazard: 3, eshot: 4, pshot: 4 };
        const list = this.entities.slice().sort((a, b) => (order[a.type] || 2) - (order[b.type] || 2));
        for (const e of list) e.draw(ctx, view);
        this.player.draw(ctx, view);
        for (const p of this.particles) p.draw(ctx, view);
        for (const t of this.texts) t.draw(ctx, view);

        this.drawHUD(ctx);
      }

      switch (this.state) {
        case 'title':    this.drawTitle(ctx); break;
        case 'select':   this.drawSelect(ctx); break;
        case 'howto':    this.drawHowto(ctx); break;
        case 'intro':    this.drawIntro(ctx); break;
        case 'pause':    this.drawPause(ctx); break;
        case 'clear':    this.drawClear(ctx); break;
        case 'gameover': this.drawGameOver(ctx); break;
        case 'allclear': this.drawAllClear(ctx); break;
      }

      if (this.toastTimer > 0) this.drawToast(ctx);

      if (this.fadeIn > 0) {
        ctx.save();
        ctx.globalAlpha = U.clamp(this.fadeIn / 30, 0, 1);
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, KK.W, KK.H);
        ctx.restore();
      }
    }

    /* ── HUD ─────────────────────────────────────── */
    drawHUD(ctx) {
      const p = this.player;

      // 좌상단 : 체력 + 목숨
      panel(ctx, 12, 12, 214, 46, 12);
      for (let i = 0; i < p.maxHp; i++) heartIcon(ctx, 36 + i * 30, 36, 11, i < p.hp);
      text(ctx, '×' + Math.max(0, this.lives), 150, 42, { size: 19, color: '#ffe27a' });
      ctx.save();
      ctx.translate(196, 48); ctx.scale(0.42, 0.42);
      S.kkukkuki(ctx, 46, 50, { tick: this.tick, state: 'idle' });
      ctx.restore();

      // 중앙 상단 : 스테이지 + 시간
      const cw = 250;
      panel(ctx, KK.W / 2 - cw / 2, 12, cw, 46, 12);
      text(ctx, this.def.name, KK.W / 2, 32, { size: 15, align: 'center', color: '#cfe0ff' });
      const low = this.timeLeft < 30;
      text(ctx, '⏱ ' + U.mmss(this.timeLeft), KK.W / 2, 52, {
        size: 17, align: 'center',
        color: low ? (Math.floor(this.tick / 8) % 2 ? '#ff6b6b' : '#ffb3b3') : '#fff'
      });

      // 우상단 : 점수 / 열매
      panel(ctx, KK.W - 226, 12, 214, 46, 12);
      text(ctx, 'SCORE ' + String(this.score).padStart(6, '0'), KK.W - 216, 32, { size: 15, color: '#ffe27a' });
      ctx.save(); ctx.translate(KK.W - 206, 52); S.coin(ctx, 18, 18, { tick: this.tick }); ctx.restore();
      text(ctx, `${this.stageCoins} / ${this.totalCoins}`, KK.W - 192, 52, { size: 15 });
      text(ctx, `적 ${this.stageKills}/${this.totalEnemies}`, KK.W - 108, 52, { size: 15, color: '#ffb3c8' });

      // 파워업 게이지
      const powers = [
        ['star', p.power.invincible, 9 * 60, '무적'],
        ['bolt', p.power.speedy, 10 * 60, '스피드'],
        ['wing', p.power.flying, 9 * 60, '날개'],
        ['gun', p.power.powerShot, 11 * 60, '파워샷']
      ].filter(x => x[1] > 0);

      let py = 70;
      for (const [kind, cur, max, label] of powers) {
        panel(ctx, 12, py, 176, 30, 9, 'rgba(12,18,32,.66)');
        ctx.save(); ctx.translate(30, py + 24); S.item(ctx, 22, 22, { tick: this.tick, kind }); ctx.restore();
        text(ctx, label, 46, py + 20, { size: 13 });
        const bw = 78;
        ctx.save();
        U.roundRect(ctx, 96, py + 10, bw, 9, 4); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
        U.roundRect(ctx, 96, py + 10, bw * U.clamp(cur / max, 0, 1), 9, 4);
        ctx.fillStyle = KK.ITEM_INFO[kind].color; ctx.fill();
        ctx.restore();
        py += 34;
      }

      // 퀘스트 진행 상황
      const res = this.questResults();
      const qh = 24 + res.length * 20;
      panel(ctx, KK.W - 226, 70, 214, qh, 10, 'rgba(12,18,32,.62)');
      text(ctx, '퀘스트', KK.W - 216, 88, { size: 13, color: '#9ec1ff' });
      res.forEach((r, i) => {
        const y = 106 + i * 20;
        text(ctx, (r.done ? '★ ' : '☆ ') + r.q.label, KK.W - 216, y, {
          size: 13, color: r.done ? '#7dffa8' : 'rgba(255,255,255,.72)', strokeW: 4
        });
      });

      // 콤보
      if (p.combo > 1) {
        text(ctx, 'COMBO ×' + p.combo, KK.W / 2, 86, { size: 22, align: 'center', color: '#ff9de2' });
      }

      // 보스 등장 안내
      const boss = this.entities.find(e => e.boss && !e.dead);
      if (boss && Math.abs(boss.cx - p.cx) < 620) {
        text(ctx, '보스 : 킹 고릴라', KK.W / 2, KK.H - 22, { size: 16, align: 'center', color: '#ffbdbd' });
      }
    }

    drawToast(ctx) {
      const a = U.clamp(this.toastTimer / 30, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      const w = Math.max(180, this.toastMsg.length * 15 + 44);
      panel(ctx, KK.W / 2 - w / 2, KK.H - 96, w, 40, 12, 'rgba(12,18,32,.85)');
      text(ctx, this.toastMsg, KK.W / 2, KK.H - 69, { size: 18, align: 'center', color: '#ffe27a' });
      ctx.restore();
    }

    /* ── 메뉴 배경 ───────────────────────────────── */
    drawMenuBackground(ctx) {
      const t = this.tick;
      const g = ctx.createLinearGradient(0, 0, 0, KK.H);
      g.addColorStop(0, '#1b2a5e'); g.addColorStop(0.5, '#3f6bb8'); g.addColorStop(1, '#8fd3f4');
      ctx.fillStyle = g; ctx.fillRect(0, 0, KK.W, KK.H);

      // 별
      ctx.save();
      for (let i = 0; i < 60; i++) {
        const x = (i * 137.5) % KK.W, y = (i * 61.3) % 260;
        ctx.globalAlpha = 0.25 + Math.abs(Math.sin(t * 0.02 + i)) * 0.6;
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.restore();

      // 언덕
      ctx.fillStyle = '#2f7a56';
      ctx.beginPath();
      ctx.moveTo(0, KK.H);
      for (let x = 0; x <= KK.W; x += 20)
        ctx.lineTo(x, KK.H - 90 - Math.sin(x * 0.008 + t * 0.004) * 26);
      ctx.lineTo(KK.W, KK.H); ctx.fill();
      ctx.fillStyle = '#3f9c37';
      ctx.beginPath();
      ctx.moveTo(0, KK.H);
      for (let x = 0; x <= KK.W; x += 20)
        ctx.lineTo(x, KK.H - 46 - Math.sin(x * 0.011 - t * 0.006) * 16);
      ctx.lineTo(KK.W, KK.H); ctx.fill();
    }

    drawTitle(ctx) {
      const t = this.tick;
      // 타이틀 꾹꾹이
      ctx.save();
      ctx.translate(KK.W / 2, 300 + Math.sin(t * 0.04) * 7);
      S.kkukkuki(ctx, 120, 132, { tick: t, state: 'idle' });
      ctx.restore();

      text(ctx, '꾹꾹이의 대모험', KK.W / 2, 108, { size: 54, align: 'center', color: '#ffe27a', strokeW: 9 });
      text(ctx, 'KKUKKUKI  ADVENTURE', KK.W / 2, 138, { size: 16, align: 'center', color: '#cfe0ff', strokeW: 4 });

      const items = ['게임 시작', '스테이지 선택', '조작법'];
      items.forEach((s, i) => {
        const y = 362 + i * 42;
        const sel = i === this.menuIndex;
        if (sel) {
          panel(ctx, KK.W / 2 - 132, y - 26, 264, 36, 10, 'rgba(255,226,122,.22)');
          ctx.save();
          ctx.translate(KK.W / 2 - 152 + Math.sin(t * 0.15) * 4, y - 8);
          ctx.fillStyle = '#ffe27a';
          ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(12, 0); ctx.lineTo(0, 8); ctx.fill();
          ctx.restore();
        }
        text(ctx, s, KK.W / 2, y, { size: 24, align: 'center', color: sel ? '#fff' : 'rgba(255,255,255,.62)' });
      });

      text(ctx, '↑↓ 선택 · Enter / Space 결정', KK.W / 2, KK.H - 26, { size: 14, align: 'center', color: '#cfe0ff', strokeW: 4 });
    }

    drawSelect(ctx) {
      text(ctx, '스테이지 선택', KK.W / 2, 82, { size: 34, align: 'center', color: '#ffe27a' });
      const n = KK.LEVELS.length;
      const cw = 232, gap = 22;
      const totalW = n * cw + (n - 1) * gap;
      let x = KK.W / 2 - totalW / 2;
      for (let i = 0; i < n; i++) {
        const lv = KK.LEVELS[i];
        const locked = i + 1 > this.save.unlocked;
        const sel = i === this.selIndex;
        const y = 140 + (sel ? -8 : 0);
        panel(ctx, x, y, cw, 250, 16, sel ? 'rgba(30,48,88,.92)' : 'rgba(12,18,32,.72)');
        if (sel) {
          ctx.save(); ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 3;
          U.roundRect(ctx, x, y, cw, 250, 16); ctx.stroke(); ctx.restore();
        }
        // 미니 미리보기
        this.drawStagePreview(ctx, lv, x + 14, y + 16, cw - 28, 92, locked);
        text(ctx, `STAGE ${lv.id}`, x + cw / 2, y + 132, { size: 15, align: 'center', color: '#9ec1ff' });
        text(ctx, locked ? '???' : lv.name, x + cw / 2, y + 160, { size: 22, align: 'center' });

        // 별
        const st = this.save.stars[lv.id] || 0;
        for (let s = 0; s < 3; s++) {
          ctx.save();
          ctx.translate(x + cw / 2 - 34 + s * 34, y + 190);
          ctx.fillStyle = s < st ? '#ffd23f' : 'rgba(255,255,255,.2)';
          S.starPath(ctx, 0, 0, 13, 5.6, 5); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; ctx.stroke();
          ctx.restore();
        }
        const best = this.save.best[lv.id] || 0;
        text(ctx, locked ? '잠김 🔒' : ('최고 ' + String(best).padStart(6, '0')), x + cw / 2, y + 226,
          { size: 14, align: 'center', color: locked ? '#ff9d9d' : '#ffe27a' });
        x += cw + gap;
      }
      text(ctx, '← → 이동 · Enter 시작 · P 뒤로', KK.W / 2, KK.H - 34, { size: 14, align: 'center', color: '#cfe0ff', strokeW: 4 });
    }

    drawStagePreview(ctx, lv, x, y, w, h, locked) {
      ctx.save();
      U.roundRect(ctx, x, y, w, h, 10); ctx.clip();
      const th = lv.theme;
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      if (th === 'forest') { g.addColorStop(0, '#4aa8e0'); g.addColorStop(1, '#d9f2ff'); }
      else if (th === 'city') { g.addColorStop(0, '#2e5f9e'); g.addColorStop(1, '#cfe6f7'); }
      else { g.addColorStop(0, '#2b1c53'); g.addColorStop(0.6, '#e8734a'); g.addColorStop(1, '#ffc46b'); }
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      if (!locked) {
        ctx.fillStyle = th === 'city' ? '#3d5a80' : (th === 'sunset' ? '#3d2350' : '#2f7a56');
        for (let i = 0; i < 7; i++) {
          const bx = x + 8 + i * (w / 7), bh = 20 + ((i * 37) % 40);
          if (th === 'forest') { ctx.beginPath(); ctx.ellipse(bx + 12, y + h - 14, 20, bh * 0.5, 0, Math.PI, 0); ctx.fill(); }
          else ctx.fillRect(bx, y + h - 14 - bh, 22, bh);
        }
        ctx.fillStyle = th === 'sunset' ? '#6b4b3a' : '#8a5a33';
        ctx.fillRect(x, y + h - 14, w, 14);
        ctx.fillStyle = th === 'sunset' ? '#a9713f' : '#5ec24f';
        ctx.fillRect(x, y + h - 14, w, 4);
        ctx.save();
        ctx.translate(x + w * 0.3, y + h - 14);
        S.kkukkuki(ctx, 26, 30, { tick: this.tick, state: 'idle' });
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, y, w, h);
        text(ctx, '🔒', x + w / 2, y + h / 2 + 10, { size: 30, align: 'center' });
      }
      ctx.restore();
    }

    drawHowto(ctx) {
      panel(ctx, 90, 54, KK.W - 180, KK.H - 108, 18, 'rgba(10,16,30,.9)');
      text(ctx, '조작법 & 게임 방법', KK.W / 2, 102, { size: 30, align: 'center', color: '#ffe27a' });

      const lines = [
        ['← →', '걷기 / 달리기 (계속 누르면 점점 빨라져요)'],
        ['Space / Z', '점프 — 길게 누르면 더 높이!'],
        ['X / J', '씨앗 총 발사'],
        ['↑ + X', '위쪽으로 발사'],
        ['↓', '웅크리기 · 통과 발판에서 ↓+점프 = 내려가기'],
        ['P / Esc', '일시정지    R : 스테이지 재시작    M : 음악'],
      ];
      lines.forEach((l, i) => {
        const y = 152 + i * 32;
        text(ctx, l[0], 150, y, { size: 17, color: '#8fd3f4' });
        text(ctx, l[1], 300, y, { size: 16, color: 'rgba(255,255,255,.9)' });
      });

      text(ctx, '이것만 알면 고수!', KK.W / 2, 372, { size: 20, align: 'center', color: '#ffe27a' });
      const tips = [
        '· 적을 밟으면 밟는 순간 점프를 누른 채로 → 더 높이 튄다 (연속 밟기 = 콤보 점수!)',
        '· 드럼통은 총으로 못 부순다. 반드시 점프로 피하거나 파워 샷으로!',
        '· ? 상자는 아래에서 머리로 치거나 총으로 쏘면 열린다.',
      ];
      tips.forEach((s, i) => text(ctx, s, 150, 402 + i * 26, { size: 15, color: 'rgba(255,255,255,.85)' }));

      text(ctx, 'Enter / Space 로 돌아가기', KK.W / 2, KK.H - 42, { size: 15, align: 'center', color: '#cfe0ff' });
    }

    drawIntro(ctx) {
      const a = U.clamp(this.introTimer / 40, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.55 * a;
      ctx.fillStyle = '#04070f'; ctx.fillRect(0, 0, KK.W, KK.H);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = a;
      text(ctx, `STAGE ${this.def.id}`, KK.W / 2, 210, { size: 22, align: 'center', color: '#9ec1ff' });
      text(ctx, this.def.name, KK.W / 2, 268, { size: 46, align: 'center', color: '#ffe27a' });
      text(ctx, this.def.intro, KK.W / 2, 316, { size: 17, align: 'center', color: 'rgba(255,255,255,.9)' });
      text(ctx, '아무 키나 누르면 시작!', KK.W / 2, 384, { size: 15, align: 'center', color: '#cfe0ff' });
      ctx.restore();
    }

    drawPause(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(4,7,15,.72)'; ctx.fillRect(0, 0, KK.W, KK.H);
      ctx.restore();
      text(ctx, '일시정지', KK.W / 2, 232, { size: 46, align: 'center', color: '#ffe27a' });
      text(ctx, KK.isTouch ? '아무 버튼이나 눌러서 계속하기' : 'P / Enter : 계속하기', KK.W / 2, 292, { size: 18, align: 'center' });
      text(ctx, 'R : 스테이지 처음부터', KK.W / 2, 324, { size: 18, align: 'center', color: 'rgba(255,255,255,.8)' });
      text(ctx, 'M : 음악 켜기/끄기', KK.W / 2, 356, { size: 18, align: 'center', color: 'rgba(255,255,255,.8)' });
    }

    drawClear(ctx) {
      const a = U.clamp(this.clearTimer / 30, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.78 * a;
      ctx.fillStyle = '#04070f'; ctx.fillRect(0, 0, KK.W, KK.H);
      ctx.restore();

      text(ctx, 'STAGE CLEAR!', KK.W / 2, 108, { size: 46, align: 'center', color: '#ffe27a' });

      // 별
      for (let i = 0; i < 3; i++) {
        const got = i < this.stars;
        const pop = U.clamp((this.clearTimer - 20 - i * 18) / 12, 0, 1);
        ctx.save();
        ctx.translate(KK.W / 2 - 84 + i * 84, 176);
        ctx.scale(0.6 + pop * 0.5, 0.6 + pop * 0.5);
        ctx.fillStyle = got ? '#ffd23f' : 'rgba(255,255,255,.16)';
        S.starPath(ctx, 0, 0, 32, 14, 5); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
        ctx.restore();
      }

      panel(ctx, KK.W / 2 - 250, 224, 500, 190, 16);
      this.results.forEach((r, i) => {
        const y = 258 + i * 30;
        text(ctx, (r.done ? '★' : '☆') + '  ' + r.q.label, KK.W / 2 - 226, y,
          { size: 17, color: r.done ? '#7dffa8' : 'rgba(255,255,255,.6)' });
        let cur = '';
        if (r.q.kind === 'coins' || r.q.kind === 'kills') cur = `${r.cur} / ${r.q.target}`;
        else if (r.q.kind === 'time') cur = `${U.mmss(this.elapsed)} / ${U.mmss(r.q.target)}`;
        else if (r.q.kind === 'nohit') cur = `맞은 횟수 ${this.stageHits}`;
        else if (r.q.kind === 'boss') cur = this.bossKilled ? '격파!' : '실패';
        text(ctx, cur, KK.W / 2 + 226, y, { size: 16, align: 'right', color: 'rgba(255,255,255,.85)' });
      });
      text(ctx, '남은 시간 보너스 + 별 보너스', KK.W / 2 - 226, 364, { size: 15, color: '#9ec1ff' });
      text(ctx, '+' + this.clearBonus, KK.W / 2 + 226, 364, { size: 17, align: 'right', color: '#ffe27a' });
      text(ctx, 'TOTAL  ' + String(this.score).padStart(6, '0'), KK.W / 2, 400, { size: 22, align: 'center', color: '#ffe27a' });

      if (this.clearTimer > 40 && Math.floor(this.tick / 24) % 2 === 0) {
        const last = this.stageIndex + 1 >= KK.LEVELS.length;
        text(ctx, last ? 'Enter : 마지막 결과 보기' : 'Enter : 다음 스테이지로!', KK.W / 2, 458,
          { size: 19, align: 'center', color: '#fff' });
      }
    }

    drawGameOver(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(4,7,15,.82)'; ctx.fillRect(0, 0, KK.W, KK.H);
      ctx.restore();
      text(ctx, 'GAME OVER', KK.W / 2, 218, { size: 54, align: 'center', color: '#ff7b7b' });
      text(ctx, '점수  ' + String(this.score).padStart(6, '0'), KK.W / 2, 274, { size: 22, align: 'center', color: '#ffe27a' });
      text(ctx, '꾹꾹이는 포기하지 않아!', KK.W / 2, 322, { size: 18, align: 'center', color: 'rgba(255,255,255,.85)' });
      if (Math.floor(this.tick / 24) % 2 === 0)
        text(ctx, 'Enter : 이 스테이지 다시 도전', KK.W / 2, 386, { size: 19, align: 'center' });
    }

    drawAllClear(ctx) {
      const t = this.tick;
      const g = ctx.createLinearGradient(0, 0, 0, KK.H);
      g.addColorStop(0, '#221247'); g.addColorStop(1, '#7a3f8f');
      ctx.fillStyle = g; ctx.fillRect(0, 0, KK.W, KK.H);
      for (let i = 0; i < 90; i++) {
        const x = (i * 97 + t * (1 + (i % 5))) % KK.W;
        const y = (i * 53 + t * 1.6 * (1 + (i % 3))) % KK.H;
        ctx.fillStyle = `hsl(${(i * 37) % 360},90%,68%)`;
        ctx.fillRect(x, y, 5, 9);
      }
      ctx.save();
      ctx.translate(KK.W / 2, 420 + Math.sin(t * 0.06) * 10);
      S.kkukkuki(ctx, 130, 143, { tick: t, state: 'idle', invincible: true });
      ctx.restore();
      text(ctx, '모든 스테이지 클리어!', KK.W / 2, 110, { size: 44, align: 'center', color: '#ffe27a' });
      text(ctx, '최종 점수  ' + String(this.score).padStart(6, '0'), KK.W / 2, 158, { size: 24, align: 'center' });
      const totalStars = KK.LEVELS.reduce((a, l) => a + (this.save.stars[l.id] || 0), 0);
      text(ctx, `모은 별  ${totalStars} / ${KK.LEVELS.length * 3}`, KK.W / 2, 196, { size: 20, align: 'center', color: '#ffd23f' });
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.translate(KK.W / 2 - 42 + i * 42, 236);
        ctx.fillStyle = '#ffd23f'; S.starPath(ctx, 0, 0, 15, 6.5, 5); ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
        ctx.restore();
      }
      text(ctx, '꾹꾹이가 숲과 도시를 지켜냈다!', KK.W / 2, 288, { size: 18, align: 'center', color: 'rgba(255,255,255,.9)' });
      if (Math.floor(t / 24) % 2 === 0)
        text(ctx, 'Enter : 타이틀로', KK.W / 2, KK.H - 46, { size: 18, align: 'center' });
    }
  }

  /* ============================================================
     부팅
     ============================================================ */
  global.addEventListener('load', () => {
    const canvas = document.getElementById('game');
    KK.input.init();
    const game = new Game(canvas);
    KK.game = game;

    const unlock = () => { KK.audio.ensure(); };
    global.addEventListener('pointerdown', unlock, { once: true });
    global.addEventListener('keydown', unlock, { once: true });

    let last = performance.now();
    let acc = 0;
    const STEP = 1000 / KK.FPS;

    function frame(now) {
      let delta = now - last;
      last = now;
      if (delta > 250) delta = 250;   // 탭 전환 후 폭주 방지
      acc += delta;
      let guard = 0;
      while (acc >= STEP && guard < 5) {
        game.update(1);
        KK.input.update();
        acc -= STEP;
        guard++;
      }
      if (guard >= 5) acc = 0;
      game.draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });

})(window);

</script>
