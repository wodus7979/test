<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2430">
  <meta name="description" content="피아노 소리와 박자를 함께 따라가며 악보를 자동으로 넘겨 주는 앱">
  <title>자동 악보 넘기기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="악보 넘기기">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">🎹 자동 악보 넘기기</div>

    <div class="group">
      <label class="btn" title="MusicXML(.musicxml, .xml, .mxl) 악보 불러오기" aria-label="악보 불러오기">
        📂<span class="txt"> 악보 불러오기</span>
        <input id="file" type="file" accept=".musicxml,.xml,.mxl,.pdf,image/*" hidden>
      </label>
      <button id="sample" class="btn ghost" type="button" aria-label="샘플 악보">🎼<span class="txt"> 샘플 악보</span></button>
    </div>

    <div class="group">
      <button id="start" class="btn primary" type="button" disabled>▶ 듣기 시작</button>
      <button id="demo" class="btn" type="button" disabled title="피아노 없이 합성음으로 연주해 시험해 보기" aria-label="데모 연주">🎵<span class="txt"> 데모 연주</span></button>
      <button id="settingsBtn" class="btn ghost" type="button" aria-expanded="false" aria-controls="settings" aria-label="설정">⚙<span class="txt"> 설정</span></button>
      <button id="install" class="btn ghost" type="button" hidden title="홈 화면에 앱으로 설치" aria-label="앱 설치">📲<span class="txt"> 앱 설치</span></button>
      <button id="update" class="btn primary" type="button" hidden title="새 버전으로 새로고침">🔄 새 버전</button>
    </div>
  </header>

  <section id="settings" class="settings" hidden>
    <label>추적 방식
      <select id="mode">
        <option value="hybrid">소리 + 박자 (추천)</option>
        <option value="tempo">박자만 (메트로놈처럼)</option>
        <option value="audio">소리만</option>
      </select>
    </label>
    <label>시작 템포 (BPM)
      <input id="tempo" type="number" min="20" max="300" step="1">
    </label>
    <label title="마지막 마디를 치기 몇 박 전에 넘길지">미리 넘기기 (박)
      <input id="lookahead" type="number" min="0" max="16" step="0.5" value="2">
    </label>
    <label>마이크 민감도
      <input id="sensitivity" type="range" min="1" max="10" step="1" value="5">
    </label>
    <label>악보 크기
      <input id="zoom" type="range" min="0.6" max="1.8" step="0.1" value="1">
    </label>
    <label>데모 연주 속도
      <select id="demoSpeed">
        <option value="0.7">70% (느리게)</option>
        <option value="0.85" selected>85%</option>
        <option value="1">100% (악보 템포)</option>
        <option value="1.2">120% (빠르게)</option>
      </select>
    </label>
    <label class="check"><input id="rubato" type="checkbox" checked> 데모에서 템포 흔들기</label>
    <label class="check"><input id="demoSound" type="checkbox" checked> 데모 소리 스피커로 듣기</label>
  </section>

  <main id="viewport" class="viewport">
    <div id="empty" class="empty">
      <h1>악보를 불러와 주세요</h1>
      <p><b>MusicXML</b>(.musicxml / .xml / .mxl) 파일을 끌어다 놓거나 <b>📂 악보 불러오기</b>를 누르세요.<br>
        PDF·사진 악보는 MuseScore, Audiveris 같은 프로그램으로 MusicXML로 바꾼 뒤 불러오면 됩니다.</p>
      <p>먼저 체험해 보려면 <b>샘플 악보</b> → <b>🎵 데모 연주</b>를 눌러 보세요.</p>
    </div>
    <button id="prev" class="nav prev" type="button" aria-label="이전 페이지">‹</button>
    <button id="next" class="nav next" type="button" aria-label="다음 페이지">›</button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <footer class="statusbar">
    <span id="status" class="pill">대기</span>
    <span>마디 <b id="measure">–</b></span>
    <span>페이지 <b id="page">–</b></span>
    <span>템포 <b id="bpm">–</b></span>
    <span class="meter" title="입력 음량"><i id="level"></i></span>
    <span class="chroma" id="chroma" title="들리는 음 (C~B)"></span>
    <span class="hint">마디를 누르면 그곳부터 시작 · ←/→ 수동 넘김 · Space 시작/정지</span>
  </footer>

  <script src="vendor/opensheetmusicdisplay.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="samples/sample-score.js"></script>
  <script src="js/score-model.js"></script>
  <script src="js/score-follower.js"></script>
  <script src="js/audio-analyzer.js"></script>
  <script src="js/demo-player.js"></script>
  <script src="js/score-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
